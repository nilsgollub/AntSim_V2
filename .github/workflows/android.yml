name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# contents: write für das rollierende Release „android-latest“
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      ANTSIM_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android

      # Mit Keystore-Secret: signierte Release-APK (Updates installierbar über die alte App).
      # Ohne Secret (z. B. Fork-PRs): Debug-APK zum Testen.
      - name: Keystore bereitstellen
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANTSIM_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/antsim.keystore"
            echo "path=$RUNNER_TEMP/antsim.keystore" >> "$GITHUB_OUTPUT"
          fi

      - name: Release-APK bauen
        if: steps.keystore.outputs.path
        working-directory: android
        env:
          ANTSIM_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANTSIM_KEYSTORE_PASSWORD: ${{ secrets.ANTSIM_KEYSTORE_PASSWORD }}
          ANTSIM_KEY_PASSWORD: ${{ secrets.ANTSIM_KEYSTORE_PASSWORD }}
          ANTSIM_KEY_ALIAS: antsim
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../AntSim.apk

      - name: Debug-APK bauen
        if: ${{ !steps.keystore.outputs.path }}
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../AntSim.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AntSim-${{ github.run_number }}
          path: AntSim.apk

      # Fester Download-Link fürs Handy: .../releases/download/android-latest/AntSim.apk
      - name: Release android-latest aktualisieren
        if: github.ref == 'refs/heads/main' && steps.keystore.outputs.path
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android-latest
          git push -f origin android-latest
          gh release view android-latest >/dev/null 2>&1 || \
            gh release create android-latest --title "AntSim für Android (aktuell)" \
              --notes "Wird bei jedem Push auf main neu gebaut. APK herunterladen und installieren."
          gh release upload android-latest AntSim.apk --clobber
          gh release edit android-latest --notes "Build ${{ github.run_number }} von ${{ github.sha }}. APK herunterladen und installieren."
